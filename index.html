<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>ALPHA PROOF Ω — GitHub Standalone Backup</title>
<style>
html,body{margin:0;min-height:100%;background:#07111f;color:#edf5ff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Tahoma,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.box{width:min(560px,92vw);border:1px solid #23445f;border-radius:22px;background:linear-gradient(180deg,#0d1a2b,#07111f);padding:22px;box-shadow:0 20px 70px rgba(0,0,0,.4);text-align:center}.omega{font-size:42px;color:#54e1ff;font-weight:900}.name{font-size:21px;font-weight:950}.mode{display:inline-block;margin-top:9px;padding:5px 10px;border:1px solid #2f6d59;border-radius:999px;background:#0c2922;color:#4ee6a8;font-size:11px;font-weight:900}.msg{margin-top:13px;color:#8fa6bf;font-size:12px;line-height:1.7}.err{color:#ff7187;white-space:pre-wrap;word-break:break-word}
</style>
</head>
<body>
<div class="boot"><div class="box"><div class="omega">Ω</div><div class="name">ALPHA PROOF</div><div class="mode">LOCAL BACKUP · مستقل عن Railway</div><div id="bootMsg" class="msg">تحميل المحرك المحلي الكامل من GitHub…</div></div></div>
<script>
"use strict";
(async()=>{
  const out=document.getElementById('bootMsg');
  try{
    const r=await fetch('./public/ui-engine.html',{cache:'no-store'});
    if(!r.ok) throw new Error('تعذر تحميل ui-engine.html — HTTP '+r.status);
    let html=await r.text();
    const headInject='<script>window.__ALPHA_ENTRY_MODE__="LOCAL_STANDALONE";<\\/script><script src="./public/standalone-guard.js"><\\/script>';
    const bodyInject='<script src="./public/engine-observer.js"><\\/script>';
    if(!html.includes('<head>')||!html.includes('</body>')) throw new Error('بنية ملف المحرك غير متوقعة');
    html=html.replace('<head>','<head>'+headInject).replace('</body>',bodyInject+'</body>');
    document.open(); document.write(html); document.close();
  }catch(e){
    out.className='msg err';
    out.textContent='فشل تشغيل النسخة الاحتياطية المحلية:\n'+(e&&e.message?e.message:String(e));
  }
})();
</script>
</body>
</html>
